<section class="support-app"
         data-sly-use.model="com.ttn.support.core.models.TicketFormModel"
         data-support-ticket-form
         data-list-page="${model.listPagePath}"
         data-detail-page="${model.detailPagePath}">
    <div class="support-card">
        <header class="support-header support-header--compact">
            <a class="support-link support-link--back" href="${model.listPagePath @ context='uri'}">Back to tickets</a>
            <h1 class="support-header__title">${model.heading}</h1>
            <p class="support-header__subtitle">Fill in the details below to open a new support request.</p>
        </header>

        <div data-message class="support-hidden" role="alert" aria-live="polite"></div>

        <form class="support-form">
            <div class="support-form__field">
                <label for="support-create-title">Title <span class="support-required" aria-hidden="true">*</span></label>
                <input id="support-create-title" type="text" data-title required/>
            </div>
            <div class="support-form__field">
                <label for="support-create-description">Description <span class="support-required" aria-hidden="true">*</span></label>
                <textarea id="support-create-description" data-description rows="5" required></textarea>
            </div>
            <div class="support-form__field">
                <label for="support-create-priority">Priority</label>
                <select id="support-create-priority" data-priority>
                    <option value="LOW">Low</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HIGH">High</option>
                </select>
            </div>
            <div class="support-form__field">
                <label for="support-create-assignee">Assignee <span class="support-required" aria-hidden="true">*</span></label>
                <select id="support-create-assignee" data-assignee required></select>
            </div>
            <div class="support-form__actions">
                <a class="support-btn support-btn--ghost" href="${model.listPagePath @ context='uri'}">Cancel</a>
                <button class="support-btn support-btn--primary" type="submit" data-submit>Create Ticket</button>
            </div>
        </form>
    </div>
</section>
