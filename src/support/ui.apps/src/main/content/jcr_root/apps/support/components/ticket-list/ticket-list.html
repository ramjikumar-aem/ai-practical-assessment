<section class="support-app"
         data-sly-use.model="com.ttn.support.core.models.TicketListModel"
         data-support-ticket-list
         data-create-page="${model.createPagePath}"
         data-detail-page="${model.detailPagePath}">
    <div class="support-card">
        <header class="support-header">
            <div class="support-header__titles">
                <h1 class="support-header__title">${model.heading}</h1>
                <p class="support-header__subtitle">Search, filter, and manage support requests.</p>
            </div>
            <a class="support-btn support-btn--primary" href="${model.createPagePath @ context='uri'}">Create Ticket</a>
        </header>

        <div class="support-toolbar" role="search">
            <label class="support-toolbar__field">
                <span class="support-toolbar__label">Search</span>
                <input type="search" data-search placeholder="Search by title or description" aria-label="Search tickets"/>
            </label>
            <label class="support-toolbar__field">
                <span class="support-toolbar__label">Status</span>
                <select data-status-filter aria-label="Filter by status">
                    <option value="">All statuses</option>
                    <option value="OPEN">Open</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="RESOLVED">Resolved</option>
                    <option value="CLOSED">Closed</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </label>
            <button class="support-btn support-btn--secondary" type="button" data-search-button>Search</button>
        </div>

        <div data-message class="support-hidden" role="alert" aria-live="polite"></div>

        <div class="support-table-wrap" data-loading-container>
            <div class="support-loading support-hidden" data-loading aria-hidden="true">
                <span class="support-loading__spinner"></span>
                <span>Loading tickets...</span>
            </div>
            <table class="support-table">
                <thead class="support-table__head">
                    <tr>
                        <th scope="col">Title</th>
                        <th scope="col">Status</th>
                        <th scope="col">Priority</th>
                        <th scope="col">Assignee</th>
                        <th scope="col">Updated</th>
                    </tr>
                </thead>
                <tbody data-results></tbody>
            </table>
        </div>
    </div>
</section>
