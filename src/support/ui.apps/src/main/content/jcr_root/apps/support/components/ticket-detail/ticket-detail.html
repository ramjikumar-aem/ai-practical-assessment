<div data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-use.model="com.ttn.support.core.models.TicketDetailModel"
     data-sly-call="${clientlib.css @ categories='support.tickets'}"
     data-sly-call="${clientlib.js @ categories='support.tickets'}"></div>
<section class="support-app" data-support-ticket-detail>
    <h2>${model.heading}</h2>
    <div data-message class="support-hidden"></div>
    <form class="support-form" data-update-form>
        <label>Title <input type="text" data-title required/></label>
        <label>Description <textarea data-description required></textarea></label>
        <label>Priority
            <select data-priority>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
            </select>
        </label>
        <label>Assignee <select data-assignee required></select></label>
        <p>Status: <span data-status></span></p>
        <p>Created by: <span data-created-by></span></p>
        <p>Updated at: <span data-updated-at></span></p>
        <button type="submit">Save Changes</button>
    </form>
    <div class="support-actions" data-status-actions></div>
    <section class="support-comments">
        <h3>Comments</h3>
        <div data-comments></div>
        <form data-comment-form>
            <label>Add comment <textarea data-comment-message required></textarea></label>
            <button type="submit">Add Comment</button>
        </form>
    </section>
</section>
